<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/app.css?v=root-login-20260506b">
  <script defer src="/static/auth.js?v=root-login-20260506b"></script>
</head>
<body class="login-page">
  <main class="login-shell" data-auth-app data-login-redirect="/chat" data-redirect-when-authenticated="/chat">
    <section class="login-panel panel-surface">
      <div class="login-header">
        <span class="eyebrow">1001 TWACC Chat</span>
        <h1>登入</h1>
        <p>輸入帳號與密碼後進入聊天介面。</p>
      </div>

      <form class="auth-panel login-form" data-login-form>
        <label class="field-label" for="external-user-id">帳號</label>
        <input id="external-user-id" class="text-input" name="external_user_id" placeholder="例如：asq" autocomplete="username" required>

        <label class="field-label" for="login-password">密碼</label>
        <input id="login-password" class="text-input" name="password" type="password" minlength="4" maxlength="20" pattern="[A-Za-z0-9!-/:-@\[-`{-~]{4,20}" autocomplete="current-password" title="密碼需為 4 到 20 碼，只能包含英文、數字或特殊符號" required>

        <input id="source-system" type="hidden" name="source_system" value="erp">
        <input id="device-id" type="hidden" name="device_id">
        <input id="integration-token" type="hidden" name="integration_token" value="{{.IntegrationSharedToken}}">

        <div class="auth-actions">
          <button type="submit" class="primary-button">登入</button>
        </div>
        <div class="auth-status" data-auth-status>尚未登入</div>
      </form>

      <section class="login-session-summary" aria-live="polite">
        <strong data-login-state>未登入</strong>
        <span data-token-state>尚未保存 session token</span>
      </section>
    </section>
  </main>
</body>
</html>
