<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/app.css?v=invite-reference-20260713a">
  <script defer src="/static/invite.js?v=invite-reference-20260713a"></script>
</head>
<body class="login-page invite-page">
  <svg class="invite-icons" aria-hidden="true" focusable="false">
    <symbol id="invite-icon-mail" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="2"></rect>
      <path d="m3 7 9 6 9-6"></path>
    </symbol>
    <symbol id="invite-icon-user" viewBox="0 0 24 24">
      <path d="M20 21a8 8 0 0 0-16 0"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </symbol>
    <symbol id="invite-icon-lock" viewBox="0 0 24 24">
      <rect x="5" y="11" width="14" height="10" rx="2"></rect>
      <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
    </symbol>
  </svg>
  <main class="login-shell" data-invite-app>
    <section class="login-panel panel-surface">
      <div class="login-header invite-header">
        <span class="eyebrow">TWACC Chat</span>
        <h1>歡迎加入 TWACC Chat！</h1>
        <p>
          <span>您已收到邀請，請完成以下資訊設定帳號，</span>
          <span>即可開始使用聊天室。</span>
        </p>
      </div>

      <form class="auth-panel login-form invite-form" data-invite-form>
        <div class="invite-fieldset" aria-live="polite">
          <div class="invite-row invite-email-row">
            <svg class="invite-row-icon" aria-hidden="true">
              <use href="#invite-icon-mail"></use>
            </svg>
            <div class="invite-field-body">
              <label class="field-label" for="invite-email">Email <span>（來自邀請信）</span></label>
              <input id="invite-email" class="text-input invite-email-input" name="email" autocomplete="email" disabled>
            </div>
            <span class="invite-verified">
              <svg class="invite-verified-icon" aria-hidden="true">
                <use href="#invite-icon-lock"></use>
              </svg>
              已驗證
            </span>
          </div>

          <div class="invite-row">
            <svg class="invite-row-icon" aria-hidden="true">
              <use href="#invite-icon-user"></use>
            </svg>
            <div class="invite-field-body">
              <label class="field-label" for="invite-account">帳號</label>
              <input id="invite-account" class="text-input" name="account" maxlength="100" autocomplete="username" placeholder="請輸入帳號（英數字 4-20 碼）" required disabled>
            </div>
          </div>

          <div class="invite-row">
            <svg class="invite-row-icon" aria-hidden="true">
              <use href="#invite-icon-user"></use>
            </svg>
            <div class="invite-field-body">
              <label class="field-label" for="invite-nickname">暱稱</label>
              <input id="invite-nickname" class="text-input" name="nickname" maxlength="100" autocomplete="name" placeholder="請輸入暱稱（顯示於聊天室）" required disabled>
            </div>
          </div>

          <div class="invite-row">
            <svg class="invite-row-icon" aria-hidden="true">
              <use href="#invite-icon-lock"></use>
            </svg>
            <div class="invite-field-body">
              <label class="field-label" for="invite-password">密碼</label>
              <input id="invite-password" class="text-input" name="password" type="password" minlength="4" maxlength="20" pattern="[A-Za-z0-9!-/:-@\[-`{-~]{4,20}" autocomplete="new-password" placeholder="請輸入密碼（至少 4 碼）" title="密碼需為 4 到 20 碼，只能包含英文、數字或特殊符號" required disabled>
            </div>
          </div>

          <div class="invite-row">
            <svg class="invite-row-icon" aria-hidden="true">
              <use href="#invite-icon-lock"></use>
            </svg>
            <div class="invite-field-body">
              <label class="field-label" for="invite-password-confirmation">確認密碼</label>
              <input id="invite-password-confirmation" class="text-input" name="password_confirmation" type="password" minlength="4" maxlength="20" pattern="[A-Za-z0-9!-/:-@\[-`{-~]{4,20}" autocomplete="new-password" placeholder="請再次輸入密碼" required disabled>
            </div>
          </div>
        </div>

        <div class="login-field-error" data-invite-field-error role="alert" hidden></div>

        <div class="auth-actions">
          <button type="submit" class="primary-button invite-submit" data-invite-submit disabled>建立帳號，開始聊天 ✨</button>
        </div>
        <div class="invite-help">
          <strong>邀請連結失效？</strong>
          <span>請聯絡系統管理員重新寄送邀請信。</span>
        </div>
        <div class="auth-status" data-invite-status role="status">正在檢查邀請...</div>
      </form>
    </section>
  </main>
</body>
</html>
